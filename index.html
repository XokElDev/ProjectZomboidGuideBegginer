<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Zomboid - Guía Táctica & Nodos (v3.3)</title>
    <style>
        /* --------------------------------------------------
           VARIABLES & THEME CONFIGURATION
           -------------------------------------------------- */
        :root {
            /* Colores Base (Dark Mode Default) */
            --bg-body: #121212;
            --bg-panel: #1e1e1e;
            --bg-card: #2d2d2d;
            --bg-header: rgba(18, 18, 18, 0.95);
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --highlight-match: rgba(255, 215, 0, 0.2);
            --highlight-border: #ffd700;

            /* Node Graph Colors */
            --grid-line: rgba(255, 255, 255, 0.05);
            --node-bg: #1a1a1a;
            --node-border: #000;
            --wire-color: #555;
            --wire-active: #ffd700;
            --pin-color: #777;
            --pin-hover: #fff;

            /* PZ Theme Semantic Colors */
            --color-loot: #4caf50;
            --color-combat: #d32f2f;
            --color-health: #e91e63;
            --color-skills: #2196f3;
            --color-cars: #ff9800;
            --color-base: #9c27b0;
            --color-pro: #ffd700;
            
            /* UI Elements */
            --radius-md: 8px;
            --radius-sm: 4px;
            --trans-speed: 0.3s;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Light Mode Overrides */
        [data-theme="light"] {
            --bg-body: #f4f4f9;
            --bg-panel: #ffffff;
            --bg-card: #f8f9fa;
            --bg-header: rgba(244, 244, 249, 0.95);
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --highlight-match: rgba(255, 215, 0, 0.4);
            --grid-line: rgba(0, 0, 0, 0.05);
            --node-bg: #fff;
            --node-border: #ccc;
            --wire-color: #aaa;
            --pin-color: #999;
            --pin-hover: #333;
        }

        /* --------------------------------------------------
           RESET & BASE STYLES
           -------------------------------------------------- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-stack);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            transition: background-color var(--trans-speed), color var(--trans-speed);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        .icon { width: 1.2em; height: 1.2em; fill: currentColor; display: inline-block; vertical-align: middle; }

        /* --------------------------------------------------
           STICKY CONTROLS HEADER
           -------------------------------------------------- */
        .app-header {
            z-index: 100;
            background-color: var(--bg-header);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            box-shadow: 0 4px 12px var(--shadow-color);
            flex-shrink: 0;
        }

        .header-content { max-width: 1800px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }

        .brand h1 { font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        .brand span { color: var(--color-combat); }
        .brand small { font-size: 0.8rem; color: var(--text-muted); display: block; line-height: 1; }

        .controls { display: flex; align-items: center; gap: 10px; flex-grow: 1; justify-content: flex-end; }

        .view-tabs { display: flex; background: var(--bg-card); padding: 4px; border-radius: 8px; margin-right: 15px; border: 1px solid var(--border-color); }
        .view-tab { padding: 6px 12px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .view-tab.active { background: var(--bg-panel); color: var(--text-main); box-shadow: 0 2px 4px var(--shadow-color); }
        .view-tab:hover:not(.active) { color: var(--text-main); }

        .search-container { position: relative; flex-grow: 1; max-width: 300px; display: flex; align-items: center; }
        .search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 35px 8px 12px; border-radius: 20px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .search-input:focus { border-color: var(--color-skills); box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2); }
        .search-icon { position: absolute; right: 12px; opacity: 0.5; pointer-events: none; }

        .btn-icon { background: transparent; border: none; color: var(--text-main); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.1); }

        /* --------------------------------------------------
           MAIN CONTAINER & VIEWS
           -------------------------------------------------- */
        .main-container { position: relative; flex-grow: 1; overflow: hidden; width: 100%; }
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; overflow-y: auto; overflow-x: hidden; }
        .view.active-view { opacity: 1; visibility: visible; z-index: 10; }

        /* --------------------------------------------------
           VIEW 1: DASHBOARD (Classic)
           -------------------------------------------------- */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; max-width: 1600px; margin: 25px auto; padding: 0 20px 50px 20px; }
        .quick-nav { display: flex; gap: 15px; overflow-x: auto; padding: 10px 20px; scrollbar-width: none; border-bottom: 1px solid var(--border-color); background: var(--bg-header); width: 100%; z-index: 90; }
        .quick-nav::-webkit-scrollbar { display: none; }
        .nav-link { font-size: 0.85rem; color: var(--text-muted); text-decoration: none; white-space: nowrap; padding: 4px 8px; border-radius: 12px; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
        .nav-link:hover, .nav-link.active { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .nav-link.active { font-weight: bold; box-shadow: inset 0 -2px 0 var(--active-color, currentColor); }

        .category-section { background-color: var(--bg-panel); border-radius: var(--radius-md); box-shadow: 0 4px 6px var(--shadow-color); border-top: 4px solid var(--section-color); display: flex; flex-direction: column; margin-bottom: 0; height: fit-content; }
        .category-header { display: flex; align-items: center; gap: 10px; padding: 15px 20px; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; }
        .category-header:hover { background-color: rgba(255,255,255,0.02); }
        .category-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--section-color); text-transform: uppercase; flex-grow: 1; }
        .toggle-icon { transition: transform 0.3s; transform: rotate(0deg); }
        .category-section.collapsed .toggle-icon { transform: rotate(-90deg); }
        .category-section.collapsed .category-content { display: none; }
        .category-content { padding: 20px; border-top: 1px solid var(--border-color); }
        .card-grid { display: flex; flex-direction: column; gap: 12px; }
        .card { background-color: var(--bg-card); border-radius: var(--radius-sm); padding: 15px; border-left: 3px solid transparent; position: relative; }
        .card:hover { border-left-color: var(--section-color); transform: translateX(5px); }
        .card h3 { font-size: 1rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .card-content { font-size: 0.9rem; color: var(--text-muted); }
        .card-content ul { padding-left: 10px; list-style: none; }
        .card-content li::before { content: "•"; color: var(--section-color); font-weight: bold; margin-right: 5px; }

        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold; background: rgba(255,255,255,0.1); }
        .badge-pro { color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.4); background: rgba(255, 215, 0, 0.1); }
        .badge-danger { color: #ef5350; border: 1px solid rgba(211, 47, 47, 0.4); background: rgba(211, 47, 47, 0.1); }
        .badge-info { color: #2196f3; border: 1px solid rgba(33, 150, 243, 0.4); background: rgba(33, 150, 243, 0.1); }

        /* --------------------------------------------------
           VIEW 2: NODE EDITOR (Canvas)
           -------------------------------------------------- */
        #nodeView {
            background-color: #111;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            cursor: grab;
            overflow: hidden;
            position: relative;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #nodeView:active { cursor: grabbing; }

        #nodeWorld {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            transform-origin: 0 0;
            pointer-events: none;
        }

        .node-layer { pointer-events: auto; }

        /* SVG Connections - FIXED COORDINATES */
        #connections {
            position: absolute;
            top: 0; left: 0; /* Aligned with World Origin */
            width: 1px; height: 1px; /* Minimal size, content spills over */
            overflow: visible; /* Critical for showing full cables */
            pointer-events: none;
            z-index: 0;
        }
        .connection-path {
            fill: none;
            stroke: var(--wire-color);
            stroke-width: 2px;
            stroke-linecap: round;
            pointer-events: none;
        }
        .connection-path.temp {
            stroke: var(--wire-active);
            stroke-dasharray: 5, 5;
        }

        /* Node Elements */
        .node-box {
            position: absolute;
            width: 320px;
            background: var(--node-bg);
            border: 2px solid #000;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 1;
            user-select: none;
            -webkit-user-select: none;
            transition: box-shadow 0.2s, height 0.3s;
            touch-action: none;
        }
        
        .node-box:hover {
            box-shadow: 0 0 0 2px var(--node-color), 0 15px 30px rgba(0,0,0,0.7);
            z-index: 5;
        }

        .node-box.minimized .node-body { display: none; }
        .node-box.minimized .node-collapse-btn { transform: rotate(-90deg); }

        .node-header {
            padding: 8px 12px;
            background: linear-gradient(to right, rgba(0,0,0,0.2), transparent);
            background-color: var(--node-color);
            border-radius: 10px 10px 0 0;
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: grab;
            position: relative;
        }
        .node-header:active { cursor: grabbing; }

        .node-collapse-btn { margin-left: auto; cursor: pointer; transition: transform 0.2s; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .node-collapse-btn:hover { background: rgba(0,0,0,0.2); }

        .node-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        /* Node Item (Expandable) */
        .node-item {
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            border-left: 2px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.2s;
        }
        .node-item:hover { background: rgba(255,255,255,0.06); }
        .node-item strong { display: block; color: var(--text-main); margin-bottom: 4px; font-size: 0.85rem; }
        
        /* Text Truncation */
        .node-item-text {
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Show only 2 lines by default */
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        /* Expanded State */
        .node-item.expanded .node-item-text {
            -webkit-line-clamp: unset; /* Show all lines */
            overflow: visible;
            color: var(--text-main);
        }
        
        .node-item-toggle {
            font-size: 0.7rem;
            color: var(--node-color);
            text-align: right;
            margin-top: 4px;
            font-weight: bold;
            opacity: 0.7;
        }
        .node-item:hover .node-item-toggle { opacity: 1; }
        .node-item.expanded .node-item-toggle { display: none; } /* Hide "Ver más" when open */

        .node-pins-container { position: absolute; top: 40px; bottom: 10px; width: 30px; display: flex; flex-direction: column; gap: 15px; pointer-events: none; }
        .pins-left { left: -15px; align-items: flex-start; }
        .pins-right { right: -15px; align-items: flex-end; }

        .node-pin {
            width: 20px; height: 20px;
            background: var(--node-bg);
            border: 3px solid var(--pin-color);
            border-radius: 50%;
            pointer-events: auto;
            cursor: crosshair;
            transition: transform 0.1s, background-color 0.1s;
        }
        .node-pin:hover, .node-pin:active { border-color: var(--wire-active); transform: scale(1.2); background: var(--pin-hover); }

        .node-start { width: 180px; text-align: center; border-radius: 50px; border: 3px solid #fff; }
        .node-start .node-header { border-radius: 40px; justify-content: center; background: transparent; padding-right: 12px; }
        .node-start .node-collapse-btn { display: none; }
        .node-start .node-body { padding: 15px; text-align: center; font-size: 0.8rem; }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .header-content { gap: 10px; }
            .view-tabs span { display: none; }
            .search-container { max-width: 150px; }
            .node-box { width: 280px; }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- STATE & DATA ---
            const rawData = JSON.parse(document.getElementById('pzData').textContent);
            let activeConnections = [];

            // Initialize default connections (Start -> All)
            rawData.forEach(cat => {
                activeConnections.push({
                    fromNode: 'node-start', fromPinIdx: 0,
                    toNode: `node-${cat.id}`, toPinIdx: 0
                });
            });

            const dashboardContainer = document.querySelector('.dashboard');
            const quickNavContainer = document.querySelector('.quick-nav');
            const nodeWorld = document.getElementById('nodeWorld');
            const svgConnections = document.getElementById('connections');
            const nodeView = document.getElementById('nodeView');

            // 1. RENDER DASHBOARD (CLASSIC)
            rawData.forEach(cat => {
                const navLink = document.createElement('a');
                navLink.href = `#${cat.id}`;
                navLink.className = 'nav-link';
                navLink.style.setProperty('--active-color', cat.color);
                navLink.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="${cat.icon}"/></svg> ${cat.title.split(' ')[0]}`;
                quickNavContainer.appendChild(navLink);

                const section = document.createElement('section');
                section.id = cat.id;
                section.className = 'category-section collapsed';
                section.style.setProperty('--section-color', cat.color);
                let cardsHtml = cat.cards.map(c => `
                    <div class="card">
                        <h3>${c.title} <span>${c.badges.map(b => `<span class="badge ${b==='Crítico'||b==='Vital'?'badge-danger':b==='Importante'?'badge-pro':'badge-info'}">${b}</span>`).join('')}</span></h3>
                        <div class="card-content"><ul>${c.content.split('. ').filter(t=>t).map(t => `<li>${t.replace('.','')}</li>`).join('')}</ul></div>
                    </div>`).join('');
                section.innerHTML = `<div class="category-header"><svg class="icon" viewBox="0 0 24 24"><path d="${cat.icon}"/></svg><h2>${cat.title}</h2><svg class="icon toggle-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></div><div class="category-content"><div class="card-grid">${cardsHtml}</div></div>`;
                dashboardContainer.appendChild(section);
            });

            // 2. RENDER NODE MAP
            function createPin(type, index) {
                const pin = document.createElement('div');
                pin.className = `node-pin pin-${type}`;
                pin.dataset.type = type;
                pin.dataset.index = index;
                return pin;
            }

            const startNode = document.createElement('div');
            startNode.className = 'node-box node-start node-layer';
            startNode.id = 'node-start';
            startNode.style.left = '50px'; startNode.style.top = '300px';
            startNode.innerHTML = `
                <div class="node-header">Superviviente</div>
                <div class="node-body">Inicio de Partida</div>
                <div class="node-pins-container pins-right" id="pins-start-out"></div>
            `;
            nodeWorld.appendChild(startNode);
            startNode.querySelector('.pins-right').appendChild(createPin('out', 0));

            const layoutMap = [ { x: 400, y: 50 }, { x: 400, y: 400 }, { x: 400, y: 750 }, { x: 800, y: 50 }, { x: 800, y: 350 }, { x: 800, y: 650 }, { x: 1200, y: 350 } ];
            rawData.forEach((cat, index) => {
                const pos = layoutMap[index] || { x: 400, y: 100 * index };
                const node = document.createElement('div');
                node.className = 'node-box node-layer';
                node.id = `node-${cat.id}`;
                node.style.left = `${pos.x}px`; node.style.top = `${pos.y}px`;
                node.style.setProperty('--node-color', cat.color);

                // Expanded Item Content Generation
                let contentHtml = cat.cards.map(c => `
                    <div class="node-item">
                        <strong>${c.title}</strong>
                        <div class="node-item-text">${c.content}</div>
                        <div class="node-item-toggle">Ver más...</div>
                    </div>
                `).join('');

                node.innerHTML = `
                    <div class="node-header">
                        <svg class="icon" viewBox="0 0 24 24"><path d="${cat.icon}"/></svg>
                        ${cat.title}
                        <div class="node-collapse-btn" title="Expandir/Contraer">▼</div>
                    </div>
                    <div class="node-body">${contentHtml}</div>
                    <div class="node-pins-container pins-left" id="pins-${cat.id}-in"></div>
                    <div class="node-pins-container pins-right" id="pins-${cat.id}-out"></div>
                `;
                
                node.querySelector('.pins-left').appendChild(createPin('in', 0));
                node.querySelector('.pins-right').appendChild(createPin('out', 0));
                nodeWorld.appendChild(node);
                makeDraggable(node);
            });
            makeDraggable(startNode);

            // 3. INTERACTION LOGIC (Unified Touch/Mouse)

            function getPointerPos(e) {
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            // A. Expand/Collapse Node (Global)
            nodeWorld.addEventListener('click', (e) => {
                // Header Minimize
                if(e.target.closest('.node-collapse-btn')) {
                    const node = e.target.closest('.node-box');
                    node.classList.toggle('minimized');
                    setTimeout(updateConnections, 350);
                }
                // Item Text Expansion
                if(e.target.closest('.node-item')) {
                    const item = e.target.closest('.node-item');
                    item.classList.toggle('expanded');
                    
                    // Update toggle text
                    const toggle = item.querySelector('.node-item-toggle');
                    if(toggle) toggle.textContent = item.classList.contains('expanded') ? '' : 'Ver más...';
                    
                    // Delay update connections to match CSS transition
                    setTimeout(updateConnections, 300);
                }
            });

            // B. Canvas Navigation
            let transform = { x: 0, y: 0, scale: 1 };
            let isPanning = false, startPan = { x: 0, y: 0 };

            function applyTransform() { nodeWorld.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`; }

            function startPanAction(e) {
                if(e.target.closest('.node-pin') || e.target.closest('.node-header') || e.target.closest('.node-item')) return;
                isPanning = true;
                const pos = getPointerPos(e);
                startPan = { x: pos.x - transform.x, y: pos.y - transform.y };
                nodeView.style.cursor = 'grabbing';
            }
            nodeView.addEventListener('mousedown', startPanAction);
            nodeView.addEventListener('touchstart', startPanAction, {passive: false});

            function movePanAction(e) {
                if (isPanning) {
                    e.preventDefault();
                    const pos = getPointerPos(e);
                    transform.x = pos.x - startPan.x;
                    transform.y = pos.y - startPan.y;
                    applyTransform();
                }
            }
            window.addEventListener('mousemove', movePanAction);
            window.addEventListener('touchmove', movePanAction, {passive: false});

            function endPanAction() { isPanning = false; nodeView.style.cursor = 'grab'; }
            window.addEventListener('mouseup', endPanAction);
            window.addEventListener('touchend', endPanAction);

            nodeView.addEventListener('wheel', (e) => {
                e.preventDefault();
                const scaleAmount = -e.deltaY * 0.001;
                transform.scale = Math.min(Math.max(0.2, transform.scale + scaleAmount), 3);
                applyTransform();
            });

            // C. Node Dragging
            function makeDraggable(element) {
                const header = element.querySelector('.node-header');
                let isDragging = false, dragStart = { x: 0, y: 0 };
                
                function startDrag(e) {
                    if(e.target.closest('.node-collapse-btn')) return;
                    isDragging = true;
                    const pos = getPointerPos(e);
                    dragStart.x = pos.x; dragStart.y = pos.y;
                    e.stopPropagation();
                }
                header.addEventListener('mousedown', startDrag);
                header.addEventListener('touchstart', startDrag, {passive: false});

                function moveDrag(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    const pos = getPointerPos(e);
                    const dx = (pos.x - dragStart.x) / transform.scale;
                    const dy = (pos.y - dragStart.y) / transform.scale;
                    element.style.left = `${(parseFloat(element.style.left)||0) + dx}px`;
                    element.style.top = `${(parseFloat(element.style.top)||0) + dy}px`;
                    dragStart.x = pos.x; dragStart.y = pos.y;
                    updateConnections();
                }
                window.addEventListener('mousemove', moveDrag);
                window.addEventListener('touchmove', moveDrag, {passive: false});

                function endDrag() { isDragging = false; }
                window.addEventListener('mouseup', endDrag);
                window.addEventListener('touchend', endDrag);
            }

            // D. Wire Connection System
            let dragWire = null;
            const tempPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
            tempPath.setAttribute("class", "connection-path temp");

            function startWireDrag(e) {
                const target = document.elementFromPoint(getPointerPos(e).x, getPointerPos(e).y);
                const pin = e.target.closest ? e.target : target;
                if(pin && pin.classList.contains('node-pin') && pin.dataset.type === 'out') {
                    e.stopPropagation(); e.preventDefault();
                    const startNode = pin.closest('.node-box');
                    dragWire = { startNodeId: startNode.id, startPinIdx: parseInt(pin.dataset.index), startX: 0, startY: 0 };
                    const pinRect = pin.getBoundingClientRect();
                    const worldRect = nodeWorld.getBoundingClientRect();
                    dragWire.startX = (pinRect.left + pinRect.width/2 - worldRect.left) / transform.scale;
                    dragWire.startY = (pinRect.top + pinRect.height/2 - worldRect.top) / transform.scale;
                    svgConnections.appendChild(tempPath);
                    updateTempWire(dragWire.startX, dragWire.startY);
                }
            }
            nodeWorld.addEventListener('mousedown', startWireDrag);
            nodeWorld.addEventListener('touchstart', startWireDrag, {passive: false});

            function moveWireDrag(e) {
                if(dragWire) {
                    e.preventDefault();
                    const pos = getPointerPos(e);
                    const worldRect = nodeWorld.getBoundingClientRect();
                    const mouseX = (pos.x - worldRect.left) / transform.scale;
                    const mouseY = (pos.y - worldRect.top) / transform.scale;
                    updateTempWire(mouseX, mouseY);
                }
            }
            window.addEventListener('mousemove', moveWireDrag);
            window.addEventListener('touchmove', moveWireDrag, {passive: false});

            function endWireDrag(e) {
                if(dragWire) {
                    const pos = getPointerPos(e);
                    tempPath.style.display = 'none';
                    const targetEl = document.elementFromPoint(pos.x, pos.y);
                    tempPath.style.display = 'block';
                    const targetPin = targetEl ? targetEl.closest('.node-pin') : null;

                    if(targetPin && targetPin.dataset.type === 'in') {
                        const targetNode = targetPin.closest('.node-box');
                        if(targetNode.id !== dragWire.startNodeId) {
                            activeConnections.push({ fromNode: dragWire.startNodeId, fromPinIdx: dragWire.startPinIdx, toNode: targetNode.id, toPinIdx: parseInt(targetPin.dataset.index) });
                            addNewPinIfNeeded(document.getElementById(dragWire.startNodeId), 'out');
                            addNewPinIfNeeded(targetNode, 'in');
                            updateConnections();
                        }
                    }
                    if(tempPath.parentNode) tempPath.parentNode.removeChild(tempPath);
                    dragWire = null;
                }
            }
            window.addEventListener('mouseup', endWireDrag);
            window.addEventListener('touchend', endWireDrag);

            function addNewPinIfNeeded(nodeElement, type) {
                let containerId;
                if(nodeElement.id === 'node-start') { if(type === 'in') return; containerId = 'pins-start-out'; }
                else { const catId = nodeElement.id.replace('node-', ''); containerId = `pins-${catId}-${type}`; }
                const container = document.getElementById(containerId);
                if(!container) return;
                const currentPins = container.querySelectorAll('.node-pin').length;
                container.appendChild(createPin(type, currentPins));
            }

            function updateTempWire(endX, endY) {
                const startX = dragWire.startX; const startY = dragWire.startY;
                const dist = Math.abs(endX - startX) * 0.5;
                tempPath.setAttribute("d", `M ${startX} ${startY} C ${startX + dist} ${startY}, ${endX - dist} ${endY}, ${endX} ${endY}`);
            }

            function updateConnections() {
                const paths = svgConnections.querySelectorAll('.connection-path:not(.temp)');
                paths.forEach(p => p.remove());

                activeConnections.forEach(conn => {
                    const fromNode = document.getElementById(conn.fromNode);
                    const toNode = document.getElementById(conn.toNode);
                    if (!fromNode || !toNode) return;

                    const fromPins = fromNode.querySelectorAll(`.node-pins-container.pins-right .node-pin`);
                    const toPins = toNode.querySelectorAll(`.node-pins-container.pins-left .node-pin`);
                    const fromPin = fromPins[conn.fromPinIdx] || fromPins[fromPins.length-1];
                    const toPin = toPins[conn.toPinIdx] || toPins[toPins.length-1];

                    const worldRect = nodeWorld.getBoundingClientRect();
                    const fRect = fromPin.getBoundingClientRect();
                    const tRect = toPin.getBoundingClientRect();

                    const startX = (fRect.left + fRect.width/2 - worldRect.left) / transform.scale;
                    const startY = (fRect.top + fRect.height/2 - worldRect.top) / transform.scale;
                    const endX = (tRect.left + tRect.width/2 - worldRect.left) / transform.scale;
                    const endY = (tRect.top + tRect.height/2 - worldRect.top) / transform.scale;
                    const dist = Math.abs(endX - startX) * 0.5;

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", `M ${startX} ${startY} C ${startX + dist} ${startY}, ${endX - dist} ${endY}, ${endX} ${endY}`);
                    path.setAttribute("class", "connection-path");
                    path.style.stroke = fromNode.style.getPropertyValue('--node-color') || '#fff';
                    svgConnections.appendChild(path);
                });
            }

            setTimeout(updateConnections, 100);
            
            // Shared Logic
            const viewTabs = document.querySelectorAll('.view-tab');
            const views = document.querySelectorAll('.view');
            viewTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    viewTabs.forEach(t => t.classList.remove('active')); tab.classList.add('active');
                    views.forEach(v => { v.classList.remove('active-view'); if (v.id === tab.dataset.target) v.classList.add('active-view'); });
                    if(tab.dataset.target === 'nodeView') setTimeout(updateConnections, 50);
                });
            });

            const themeBtn = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('pz-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeBtn.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('pz-theme', next);
                themeBtn.querySelector('.moon').style.display = next==='dark'?'block':'none';
                themeBtn.querySelector('.sun').style.display = next==='light'?'block':'none';
            });
            themeBtn.querySelector('.moon').style.display = savedTheme==='dark'?'block':'none';
            themeBtn.querySelector('.sun').style.display = savedTheme==='light'?'block':'none';

            const normalize = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const q = normalize(e.target.value.trim());
                document.querySelectorAll('.card').forEach(c => c.classList.toggle('search-match', q.length>1 && normalize(c.textContent).includes(q)));
                document.querySelectorAll('.node-box').forEach(n => n.style.boxShadow = (q.length>1 && normalize(n.textContent).includes(q)) ? "0 0 0 4px #ffd700" : "");
            });
            document.body.addEventListener('click', (e) => {
                if(e.target.closest('.category-header')) e.target.closest('.category-section').classList.toggle('collapsed');
                if(e.target.closest('.nav-link')) {
                    e.preventDefault();
                    const el = document.getElementById(e.target.closest('.nav-link').getAttribute('href').substring(1));
                    el.classList.remove('collapsed'); el.scrollIntoView({behavior:'smooth', block:'start'});
                }
            });
        });
    </script>
</body>
</html>
